name: PlaSim documentation

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'contributing/**'
      - 'plasim/doc/**'
      - '.readthedocs.yaml'
      - 'plasim/src/**'
      - 'plasim/dat/T21/**'
      - 'lsg/src/**'
      - 'README.md'
      - 'FAQ.md'
      - 'CHANGELOG.md'
      - 'tests/README.md'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'postprocessor/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'contributing/**'
      - 'plasim/doc/**'
      - '.readthedocs.yaml'
      - 'plasim/src/**'
      - 'plasim/dat/T21/**'
      - 'lsg/src/**'
      - 'README.md'
      - 'FAQ.md'
      - 'CHANGELOG.md'
      - 'tests/README.md'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'postprocessor/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies and compilers
        run: |
          python -m pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran
      - name: Check source inventories and parameter coverage
        run: python docs/generate_reference.py --check
      - name: Build HTML and LaTeX sources
        run: |
          python -m sphinx -W --keep-going -n -b html docs docs/_build/html
          python -m sphinx -W --keep-going -n -b latex docs docs/_build/latex
      - name: Run the documented example
        run: bash docs/examples/headless-earth.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plasim-documentation-html
          path: docs/_build/html
